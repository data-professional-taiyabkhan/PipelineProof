{% extends "base.html" %}
{% from "_macros.html" import logo %}
{% block body %}
<div style="min-height:100vh;display:grid;place-items:center;background:var(--bg-soft);padding:32px 16px">
  <div style="width:100%;max-width:420px" class="stack">
    <div class="center">{{ logo() }}</div>
    {% if flash %}<div class="alert alert-{{ flash.kind }}" role="status">{{ flash.text }}</div>{% endif %}
    <div class="card card-pad">{% block card %}{% endblock %}</div>
    <p class="center small muted">{% block below %}{% endblock %}</p>
  </div>
</div>
{% endblock %}
