{% extends "base.html" %}
{% from "_macros.html" import logo %}
{% block title %}{{ title }} · PipelineProof{% endblock %}
{% block body %}
<div style="min-height:100vh;display:grid;place-items:center;background:var(--bg-soft);padding:32px 16px">
  <div class="card card-pad stack" style="max-width:520px;width:100%">
    {{ logo() }}
    <h1 style="font-size:1.4rem;margin-top:8px">{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="row"><a class="btn btn-secondary btn-sm" href="/app">Your workspace</a><a class="btn btn-ghost btn-sm" href="/">Home</a></div>
  </div>
</div>
{% endblock %}
