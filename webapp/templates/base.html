<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PipelineProof{% endblock %}</title>
  <meta name="description" content="{% block description %}PipelineProof re-runs a candidate's machine-learning take-home in a sealed sandbox, tests the model on data the candidate never saw, and shows where the work leaks. A named reviewer makes every decision.{% endblock %}">
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css?v=8">
  <script src="/static/js/htmx.min.js" defer></script>
  <script src="/static/js/app.js?v=8" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
</body>
</html>
